name: rtvc tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # sounddevice/PortAudio is deliberately not installed: the suite must
      # keep passing on a machine with no audio stack at all.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy soxr soundfile pytest

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Offline pipeline smoke test
        run: |
          python realtime.py --offline --offline-seconds 5 --engine passthrough --warmup 2
          python realtime.py --offline --offline-seconds 2 --engine fixed --fixed-cost-ms 5 --warmup 1
